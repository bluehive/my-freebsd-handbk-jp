name: Handbook Chapter 21 Storage

on:
  pull_request:
    paths:
      - 'handbook/en/ch21/**'
      - 'handbook/ja/21-disks.md'
      - 'docs/translation-ch21.json'
      - 'scripts/check_ch21_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch21-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch21/**'
      - 'handbook/ja/21-disks.md'
      - 'docs/translation-ch21.json'
      - 'scripts/check_ch21_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch21-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 21 Storage translation and pinned source
        run: python3 scripts/check_ch21_translation.py --require-complete
