name: Handbook official chapters 23-24

on:
  pull_request:
    paths:
      - 'handbook/en/ch23-ch24/**'
      - 'handbook/ja/23-zfs.md'
      - 'handbook/ja/24-filesystems.md'
      - 'docs/translation-ch23-ch24.json'
      - 'scripts/check_ch23_ch24_translations.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch23-ch24-translations.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch23-ch24/**'
      - 'handbook/ja/23-zfs.md'
      - 'handbook/ja/24-filesystems.md'
      - 'docs/translation-ch23-ch24.json'
      - 'scripts/check_ch23_ch24_translations.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch23-ch24-translations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-ch23-ch24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check both complete translations and pinned sources
        run: python3 scripts/check_ch23_ch24_translations.py --require-complete
