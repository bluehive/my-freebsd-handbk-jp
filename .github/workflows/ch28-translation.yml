name: Handbook Chapter 28 DTrace

on:
  pull_request:
    paths:
      - 'handbook/en/ch28/**'
      - 'handbook/ja/28-dtrace.md'
      - 'docs/translation-ch28.json'
      - 'scripts/check_ch28_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch28-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch28/**'
      - 'handbook/ja/28-dtrace.md'
      - 'docs/translation-ch28.json'
      - 'scripts/check_ch28_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch28-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 28 DTrace translation and pinned source
        run: python3 scripts/check_ch28_translation.py
