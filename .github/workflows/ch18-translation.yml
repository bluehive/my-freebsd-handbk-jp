name: Handbook Chapter 18 OCI Containers

on:
  pull_request:
    paths:
      - 'handbook/en/ch18/**'
      - 'handbook/ja/17-containers.md'
      - 'docs/translation-ch18.json'
      - 'scripts/check_ch18_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch18-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch18/**'
      - 'handbook/ja/17-containers.md'
      - 'docs/translation-ch18.json'
      - 'scripts/check_ch18_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch18-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 18 OCI Containers translation and pinned source
        run: python3 scripts/check_ch18_translation.py --require-complete
