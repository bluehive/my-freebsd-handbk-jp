name: Handbook Chapter 22 GEOM

on:
  pull_request:
    paths:
      - 'handbook/en/ch22/**'
      - 'handbook/ja/22-geom.md'
      - 'docs/translation-ch22.json'
      - 'scripts/check_ch22_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch22-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch22/**'
      - 'handbook/ja/22-geom.md'
      - 'docs/translation-ch22.json'
      - 'scripts/check_ch22_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch22-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 22 GEOM translation and pinned source
        run: python3 scripts/check_ch22_translation.py --require-complete
