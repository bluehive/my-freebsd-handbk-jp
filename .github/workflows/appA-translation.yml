name: Handbook Appendix A Obtaining FreeBSD

on:
  pull_request:
    paths:
      - 'handbook/en/appA/**'
      - 'handbook/ja/A-mirrors.md'
      - 'docs/translation-appA.json'
      - 'scripts/check_appA_translation.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/appA-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/appA/**'
      - 'handbook/ja/A-mirrors.md'
      - 'docs/translation-appA.json'
      - 'scripts/check_appA_translation.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/appA-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-appA:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Appendix A Obtaining FreeBSD translation and pinned source
        run: python3 scripts/check_appA_translation.py --require-complete
