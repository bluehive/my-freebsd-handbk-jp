name: Handbook Chapter 7 Network

on:
  pull_request:
    paths:
      - 'handbook/en/ch07/**'
      - 'handbook/ja/07-network.md'
      - 'docs/translation-ch07.json'
      - 'scripts/check_ch07_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch07-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch07/**'
      - 'handbook/ja/07-network.md'
      - 'docs/translation-ch07.json'
      - 'scripts/check_ch07_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch07-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 7 Network translation and pinned source
        run: python3 scripts/check_ch07_translation.py --require-complete
