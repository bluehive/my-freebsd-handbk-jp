name: Handbook Preface

on:
  pull_request:
    paths:
      - 'handbook/en/preface/**'
      - 'handbook/ja/00-preface.md'
      - 'docs/translation-preface.json'
      - 'scripts/check_preface_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/preface-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/preface/**'
      - 'handbook/ja/00-preface.md'
      - 'docs/translation-preface.json'
      - 'scripts/check_preface_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/preface-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Preface translation and pinned source
        run: python3 scripts/check_preface_translation.py --require-complete
