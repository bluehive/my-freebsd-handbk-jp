name: Handbook Appendix D OpenPGP Keys

on:
  pull_request:
    paths:
      - 'handbook/en/appD/**'
      - 'handbook/ja/D-pgpkeys.md'
      - 'docs/translation-appD.json'
      - 'scripts/check_appD_translation.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/appD-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/appD/**'
      - 'handbook/ja/D-pgpkeys.md'
      - 'docs/translation-appD.json'
      - 'scripts/check_appD_translation.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/appD-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-appD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Appendix D OpenPGP Keys translation and pinned source
        run: python3 scripts/check_appD_translation.py
