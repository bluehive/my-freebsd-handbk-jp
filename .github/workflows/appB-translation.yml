name: Handbook Appendix B Bibliography

on:
  pull_request:
    paths:
      - 'handbook/en/appB/**'
      - 'handbook/ja/B-bibliography.md'
      - 'docs/translation-appB.json'
      - 'scripts/check_appB_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/appB-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/appB/**'
      - 'handbook/ja/B-bibliography.md'
      - 'docs/translation-appB.json'
      - 'scripts/check_appB_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/appB-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-appB:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Appendix B Bibliography translation and pinned source
        run: python3 scripts/check_appB_translation.py
