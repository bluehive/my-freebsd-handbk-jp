name: Handbook Chapter 35 Advanced Networking

on:
  pull_request:
    paths:
      - 'handbook/en/ch35/**'
      - 'handbook/ja/35-advanced-networking.md'
      - 'docs/translation-ch35.json'
      - 'scripts/check_ch35_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch35-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch35/**'
      - 'handbook/ja/35-advanced-networking.md'
      - 'docs/translation-ch35.json'
      - 'scripts/check_ch35_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch35-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 35 translation and pinned source
        run: python3 scripts/check_ch35_translation.py --require-complete
