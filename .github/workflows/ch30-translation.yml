name: Handbook Chapter 30 Serial Communications

on:
  pull_request:
    paths:
      - 'handbook/en/ch30/**'
      - 'handbook/ja/30-serialcomms.md'
      - 'docs/translation-ch30.json'
      - 'scripts/check_ch30_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch30-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch30/**'
      - 'handbook/ja/30-serialcomms.md'
      - 'docs/translation-ch30.json'
      - 'scripts/check_ch30_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch30-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 30 Serial Communications translation and pinned source
        run: python3 scripts/check_ch30_translation.py --require-complete
