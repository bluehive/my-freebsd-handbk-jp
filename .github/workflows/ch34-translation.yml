name: Handbook Chapter 34 Firewalls

on:
  pull_request:
    paths:
      - 'handbook/en/ch34/**'
      - 'handbook/ja/34-firewalls.md'
      - 'docs/translation-ch34.json'
      - 'scripts/check_ch34_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch34-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch34/**'
      - 'handbook/ja/34-firewalls.md'
      - 'docs/translation-ch34.json'
      - 'scripts/check_ch34_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch34-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 34 Firewalls translation and pinned source
        run: python3 scripts/check_ch34_translation.py
