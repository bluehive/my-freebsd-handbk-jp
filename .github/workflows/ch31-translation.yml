name: Handbook Chapter 31 PPP

on:
  pull_request:
    paths:
      - 'handbook/en/ch31/**'
      - 'handbook/ja/31-ppp-and-slip.md'
      - 'docs/translation-ch31.json'
      - 'scripts/check_ch31_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch31-translation.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/ch31/**'
      - 'handbook/ja/31-ppp-and-slip.md'
      - 'docs/translation-ch31.json'
      - 'scripts/check_ch31_translation.py'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/ch31-translation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ch31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Chapter 31 PPP translation and pinned source
        run: python3 scripts/check_ch31_translation.py
