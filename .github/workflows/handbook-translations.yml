name: Handbook chapters 1-14

on:
  pull_request:
    paths:
      - 'handbook/en/through-ch14/**'
      - 'handbook/ja/**'
      - 'docs/translation-through-ch14.json'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/handbook-translations.yml'
  push:
    branches: [main]
    paths:
      - 'handbook/en/through-ch14/**'
      - 'handbook/ja/**'
      - 'docs/translation-through-ch14.json'
      - 'scripts/check_handbook_translations.py'
      - 'scripts/check_jails_translation.py'
      - '.github/workflows/handbook-translations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check completed translations and all source hashes
        run: python3 scripts/check_handbook_translations.py
